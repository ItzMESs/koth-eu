<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="https://kit.fontawesome.com/7b6e2d546d.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="style.css">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
        <script>
            var audioPlayer = null;
            // Listen for NUI Messages.
            window.addEventListener('message', function(event) {
                if (event.data.transactionType == "playSound") {
                  if (audioPlayer != null) {
                    audioPlayer.pause();
                  }
                  audioPlayer = new Howl({src: ["./client/sounds/" + event.data.transactionFile + ".ogg"]});
                  audioPlayer.volume(event.data.transactionVolume);
                  audioPlayer.play();
                }
            });
        </script>
        <script defer src="script.js"></script>
    </head>
    <body>
        <div id="hud" class="hud">

            <!-- Compass (top center) -->
            <div class="compass">
                <div class="compass-tape" id="compassTape"></div>
                <div class="compass-needle"></div>
            </div>

            <!-- Kill feed (top right) -->
            <div id="killevent" class="killevent"></div>

            <!-- Health (bottom left, under the minimap) -->
            <div class="life"><span id="life"></span></div>

            <!-- Weapon slots (bottom center) -->
            <div class="slots">
                <div id="weapon1" class="slot weapon1"></div>
                <div id="weapon2" class="slot weapon2"></div>
                <div id="weapon3" class="slot weapon3"></div>

                <div id="equiped" class="slot equiped">
                    <div class="weapon" id="equipedWepon"></div>
                    <div class="ammo"><span id="ammo">0</span></div>
                    <div class="reload"><span id="reload"></span></div>
                </div>
            </div>

            <!-- XP / money feed (left of the stats panel) -->
            <div id="xpfeed" class="xpfeed"></div>

            <!-- Stats panel (bottom right) -->
            <div class="stats">
                <div class="money">$<span id="money">0</span></div>

                <div class="level">
                    <span class="lvl" id="from">1</span>
                    <div class="xp-bar">
                        <span id="mana"></span>
                        <span class="granted"><span id="xp">0</span> / <span id="xp2">0</span></span>
                    </div>
                    <span id="to" class="hidden"></span>
                </div>

                <div class="teams">
                    <div class="team blue">
                        <span class="target"><span id="bluetarget">0</span> <i class="fas fa-flag"></i></span>
                        <span class="point" id="bluepoint">0</span>
                        <span class="players"><span id="blueplayers">0</span> <i class="fas fa-user"></i></span>
                    </div>
                    <div class="team red">
                        <span class="target"><span id="redtarget">0</span> <i class="fas fa-flag"></i></span>
                        <span class="point" id="redpoint">0</span>
                        <span class="players"><span id="redplayers">0</span> <i class="fas fa-user"></i></span>
                    </div>
                    <div class="team green">
                        <span class="target"><span id="greentarget">0</span> <i class="fas fa-flag"></i></span>
                        <span class="point" id="greenpoint">0</span>
                        <span class="players"><span id="greenplayers">0</span> <i class="fas fa-user"></i></span>
                    </div>
                </div>

                <span id="player" class="hidden"></span>
            </div>
        </div>

        <!-- Big center message (zone captured, etc.) -->
        <div id="xpcenter" class="newxp" style="display: none;">
            <h1 id="xpcenter_top"></h1>
            <h2 id="xpcenter_bottom"></h2>
        </div>
    </body>
</html>
