<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css" integrity="sha384-vp86vTRFVJgpjF9jiIGPEEqYqlDwgyBgEF109VFjmqGmIY/Y4HV4d3Gp2irVfcrp" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="banners.js"></script>
    <script defer src="app.js"></script>
</head>
<body>
    <!-- HUD layers (no focus) -->
    <div id="announce" class="announce"></div>
    <div id="bigmsg" class="bigmsg"></div>
    <div id="toasts" class="toasts"></div>
    <div id="reportToast" class="report-toast"></div>
    <div id="bountyBanner" class="bbanner"></div>
    <div id="bountyBoard" class="board"></div>
    <div id="bountyClaim" class="claim"></div>
    <div id="ksTip" class="ks-tip"></div>
    <div id="ksHud" class="khud"></div>
    <div id="endScreen" class="endscreen"></div>

    <!-- Panels (NUI focus) -->
    <div id="dim" class="dim"></div>
    <div id="admin" class="panel admin hidden"></div>
    <div id="report" class="panel report hidden"></div>
    <div id="career" class="panel career hidden"></div>
    <div id="ks" class="panel ks hidden"></div>
</body>
</html>
