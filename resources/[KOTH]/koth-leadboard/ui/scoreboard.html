<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7b6e2d546d.js" crossorigin="anonymous"></script>
    <script src="nui://koth-plus/ui/server-banner.js"></script>
    <script defer src="scripts.js"></script>
</head>
<body>
    <div class="board" id="board">

        <!-- Player info (left) -->
        <aside class="me">
            <div class="bar green"><i class="fas fa-chart-bar"></i> PLAYER INFO</div>
            <div class="me-body">
                <div class="me-name" id="meName">-</div>
                <div class="me-sub"><span id="meTeam" class="team-tag">-</span> · Rank <b id="meRank">-</b> / <span id="meTotal">0</span></div>

                <div class="me-stats">
                    <div><i class="fas fa-skull"></i><small>KILLS</small><b id="meKills">0</b></div>
                    <div><i class="fas fa-cross"></i><small>DEATHS</small><b id="meDeaths">0</b></div>
                    <div><i class="fas fa-hands-helping"></i><small>ASSISTS</small><b id="meAssists">0</b></div>
                    <div><i class="fas fa-crown"></i><small>SCORE</small><b id="meScore">0</b></div>
                    <div><i class="fas fa-crosshairs"></i><small>K/D</small><b id="meKd">0.00</b></div>
                </div>

                <div class="me-banner" id="meBanner"></div>

                <div class="me-money">
                    <span>Session earnings</span>
                    <b id="meMoney">$0</b>
                </div>
            </div>

            <div class="bar dark"><i class="fas fa-flag"></i> TEAMS</div>
            <div class="team-summary" id="teamSummary"></div>
        </aside>

        <!-- Team tables (right) -->
        <main class="tables" id="tables"></main>
    </div>
</body>
</html>
