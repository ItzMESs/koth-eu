<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css" integrity="sha384-vp86vTRFVJgpjF9jiIGPEEqYqlDwgyBgEF109VFjmqGmIY/Y4HV4d3Gp2irVfcrp" crossorigin="anonymous">
    <script src="./jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div id="wrapper" class="wrapper">
        <div class="view" id="view">
            <header class="shop-header">
                <h1 id="shopTitle">Shop</h1>
                <div class="wallet" id="wallet">$0</div>
                <div class="actions">
                    <button id="backbtn" title="Back"><i class="fas fa-arrow-left"></i></button>
                    <button id="closebtn" title="Close"><i class="fas fa-times"></i></button>
                </div>
            </header>

            <div class="classes" id="classes"></div>

            <nav class="tabs" id="tabs"></nav>
            <div class="list" id="list"></div>

            <div class="toast" id="toast"></div>
        </div>
    </div>

    <!-- Repurchase last loadout after death -->
    <div class="rebuy" id="rebuy">
        <div class="rebuy-panel">
            <h2>Repurchase Loadout?</h2>
            <div class="rebuy-grid" id="rebuySlots"></div>
            <div class="rebuy-info">
                <b>Last Loadout</b>
                <span id="rebuyClass">-</span>
            </div>
            <div class="rebuy-error" id="rebuyError"></div>
            <div class="rebuy-actions">
                <button class="rb-buy" id="rebuyBuy">BUY: $0</button>
                <button class="rb-cancel" id="rebuyCancel">CANCEL <small id="rebuyTimer"></small></button>
            </div>
        </div>
    </div>
    <script src="rebuy.js"></script>
</body>
</html>
